<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Boxing Club - Tra Cứu Võ Sĩ</title>
    <link rel="stylesheet" href="css/style_chucnang.css" />
    <link rel="stylesheet" href="css/style_user.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
  </head>
  <body>
    <div class="user-wrapper">
      <section id="login-section" class="login-box">
        <div class="logo">BOXING<span>CLUB</span></div>
        <h3>TRA CỨU VÕ SĨ</h3>
        <p>Nhập số điện thoại đã đăng ký</p>
        <div class="form-group">
          <input
            type="text"
            id="userPhoneInput"
            placeholder="Ví dụ: 0912345678"
            maxlength="10"
          />
        </div>
        <button id="btnCheckUser" class="btn-filter-submit">
          KIỂM TRA NGAY
        </button>
      </section>

      <section id="info-section" style="display: none">
        <div class="member-card shadow-pulse">
          <div class="card-logo">BOXING<span>CLUB</span></div>
          <div class="user-avatar"><i class="fas fa-user-ninja"></i></div>
          <h2 id="disp-name">---</h2>
          <p id="disp-id">Mã số: #----</p>

          <div class="user-balance-box">
            <small>SỐ DƯ TÀI KHOẢN</small>
            <h3 id="disp-balance">0đ</h3>
          </div>

          <div
            class="expiry-box"
            style="
              margin-top: 10px;
              background: rgba(255, 255, 255, 0.1);
              padding: 5px;
              border-radius: 5px;
            "
          >
            <small style="display: block; font-size: 10px; color: #eee"
              >HẠN TẬP ĐẾN NGÀY:</small
            >
            <strong id="disp-expiry" style="color: #f1c40f"
              >Chưa đăng ký</strong
            >
          </div>

          <div class="badge-status" id="disp-status" style="margin-top: 10px">
            Đang tập
          </div>
        </div>

        <div class="user-details">
          <div class="detail-item">
            <i class="fas fa-phone"></i> SĐT:
            <strong id="disp-phone">---</strong>
          </div>
          <div class="detail-item">
            <i class="fas fa-calendar-check"></i> Tham gia:
            <strong id="disp-date">---</strong>
          </div>
        </div>

        <div class="rented-area">
          <h4><i class="fas fa-clock"></i> DỤNG CỤ ĐANG THUÊ</h4>
          <div id="user-rent-list"></div>
        </div>

        <div class="user-shop-section">
          <h4><i class="fas fa-store"></i> CỬA HÀNG BOXING</h4>
          <div id="shop-container" class="shop-grid">
            <p class="empty-msg">Đang tải sản phẩm...</p>
          </div>
        </div>

        <div class="renewal-section">
          <h4><i class="fas fa-wallet"></i> GIA HẠN / NẠP TIỀN</h4>
          <div class="bank-info">
            <p>Cú pháp: <strong id="transfer-syntax">Mã-Võ-Sĩ + Tên</strong></p>
            <img
              src="https://img.vietqr.io/image/970422-123456789-compact.jpg?amount=300000&addInfo=Gia%20han%20boxing"
              alt="QR"
              width="180"
            />
          </div>
          <div class="form-group">
            <select id="renewalPackage">
              <option value="300000" data-days="30">
                Nạp 300.000đ (Gói 30 ngày)
              </option>
              <option value="500000" data-days="60">
                Nạp 500.000đ (Gói 60 ngày)
              </option>
              <option value="1000000" data-days="150">
                Nạp 1.000.000đ (Gói 150 ngày)
              </option>
            </select>
          </div>
          <button
            id="btnSendRequest"
            class="btn-save-member"
            style="background: #f1c40f; color: #000; font-weight: bold"
          >
            GỬI YÊU CẦU XÁC NHẬN
          </button>
        </div>

        <button
          onclick="location.reload()"
          class="btn-back"
          style="margin-top: 20px"
        >
          <i class="fas fa-sign-out-alt"></i> Thoát tài khoản
        </button>
      </section>
    </div>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
      import {
        getFirestore,
        collection,
        getDocs,
        query,
        where,
        addDoc,
        doc,
        updateDoc,
        orderBy,
      } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

      const firebaseConfig = {
        apiKey: "AIzaSyC7CTMzDutKdTerrLvFwEMIdcY4Q5j7KKk",
        authDomain: "boxing-web-c3549.firebaseapp.com",
        projectId: "boxing-web-c3549",
        storageBucket: "boxing-web-c3549.firebasestorage.app",
        messagingSenderId: "18316672267",
        appId: "1:18316672267:web:7c2efe094e1aa6af65f60e",
      };

      const app = initializeApp(firebaseConfig);
      const db = getFirestore(app);

      // Lưu các biến vào window để các file script bên ngoài như user.js có thể truy cập
      window.db = db;
      window.dbFuncs = {
        collection,
        getDocs,
        query,
        where,
        addDoc,
        doc,
        updateDoc,
        orderBy,
      };

      console.log("Firebase đã sẵn sàng!");
    </script>

    <script src="js/user.js" defer></script>
  </body>
</html>
