<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Boxing Club - Đăng Ký Thành Viên</title>
    <link rel="stylesheet" href="css/register.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
  </head>
  <body>
    <div class="register-container">
      <div class="register-card">
        <div class="register-header">
          <i class="fas fa-user-plus"></i>
          <h2>GIA NHẬP ĐỘI</h2>
          <p>Bắt đầu hành trình chinh phục sức mạnh</p>
        </div>

        <form id="registerForm">
          <div class="input-group">
            <label>Họ và tên (Chỉ nhập chữ)</label>
            <input
              type="text"
              id="fullname"
              placeholder="Nhập họ tên của bạn"
              required
            />
          </div>
          <div class="input-group">
            <label>Email</label>
            <input
              type="email"
              id="reg-email"
              placeholder="ví dụ: boxer@gmail.com"
              required
            />
          </div>
          <div class="input-group">
            <label>Mật khẩu</label>
            <input
              type="password"
              id="reg-password"
              placeholder="Tối thiểu 6 ký tự"
              required
            />
          </div>
          <div class="input-group">
            <label>Xác nhận mật khẩu</label>
            <input
              type="password"
              id="confirm-password"
              placeholder="Nhập lại mật khẩu"
              required
            />
          </div>
          <button type="submit" class="btn-register" id="btnSubmit">
            ĐĂNG KÝ NGAY
          </button>
        </form>

        <div class="footer-links">
          <span>Đã có tài khoản? </span>
          <a href="indexdangnhap.html">Đăng nhập tại đây</a>
        </div>
      </div>
    </div>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
      import {
        getAuth,
        createUserWithEmailAndPassword,
        signOut,
      } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
      import {
        getFirestore,
        doc,
        setDoc,
        addDoc,
        collection,
      } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

      const firebaseConfig = {
        apiKey: "AIzaSyC7CTMzDutKdTerrLvFwEMIdcY4Q5j7KKk",
        authDomain: "boxing-web-c3549.firebaseapp.com",
        projectId: "boxing-web-c3549",
        storageBucket: "boxing-web-c3549.firebasestorage.app",
        messagingSenderId: "18316672267",
        appId: "1:18316672267:web:7c2efe094e1aa6af65f60e",
      };

      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);
      const db = getFirestore(app);

      const form = document.getElementById("registerForm");

      form.onsubmit = async (e) => {
        e.preventDefault();

        const name = document.getElementById("fullname").value.trim();
        const email = document.getElementById("reg-email").value.trim();
        const pass = document.getElementById("reg-password").value;
        const confirmPass = document.getElementById("confirm-password").value;
        const btn = document.getElementById("btnSubmit");

        if (/\d/.test(name)) {
          return alert("Họ tên không được chứa chữ số!");
        }

        if (pass !== confirmPass) {
          return alert("Mật khẩu xác nhận không khớp!");
        }
        if (pass.length < 6) {
          return alert("Mật khẩu phải từ 6 ký tự trở lên!");
        }

        btn.innerText = "ĐANG TẠO HỒ SƠ...";
        btn.disabled = true;

        try {
          // 3. Tạo tài khoản trên Auth
          const userCredential = await createUserWithEmailAndPassword(
            auth,
            email,
            pass,
          );

          // 4. Lưu quyền vào collection 'user'
          await setDoc(doc(db, "user", email), {
            email: email,
            role: "user",
            name: name,
          });

          // 5. Tạo hồ sơ võ sĩ vào collection 'vosi'
          const maHV = "HV" + Math.floor(1000 + Math.random() * 9000);
          await addDoc(collection(db, "vosi"), {
            email: email,
            maHV: maHV,
            name: name,
            phone: "Chưa cập nhật",
            date: new Date().toISOString().split("T")[0],
            status: "Đang tập",
            balance: 0,
            createdAt: new Date(),
            expiryDate: null,
          });

          // Thoát tài khoản vừa tạo để yêu cầu đăng nhập lại
          await signOut(auth);

          alert(
            "Đăng ký thành công!\nMã số của bạn là: " +
              maHV +
              "\nVui lòng đăng nhập để tiếp tục.",
          );

          // --- SỬA TẠI ĐÂY: Chuyển hướng sang trang đăng nhập ---
          window.location.href = "indexdangnhap.html";
        } catch (error) {
          console.error(error);
          if (error.code === "auth/email-already-in-use") {
            alert("Email này đã được đăng ký tài khoản khác!");
          } else {
            alert("Lỗi: " + error.message);
          }
        } finally {
          btn.innerText = "ĐĂNG KÝ NGAY";
          btn.disabled = false;
        }
      };
    </script>
  </body>
</html>
